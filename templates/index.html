<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C3動画編集</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!--ソフト上部-->
  <header class="topbar">
    <h1>🎬 C3動画編集</h1>
    <div class="toolbar">
      <label class="file-btn">
        + ファイルを追加（音声/画像/動画）
        <input type="file" id="fileInput" accept="audio/*,image/*,video/*" multiple hidden>
      </label>
    </div>
    <span class="spacer"></span>
    <div class="toolbar">
      <!-- 選択肢はscript.jsのCANVAS_PRESETSから作る -->
      <select id="canvasSizeSelect" class="select" title="プレビューと書き出す動画の画面サイズ"></select>
      <select id="formatSelect" class="select">
        <option value="mp4">MP4（動画）</option>
        <option value="wav">WAV（音声のみ）</option>
        <option value="mp3">MP3（音声のみ）</option>
      </select>
      <button id="exportBtn" class="btn primary">⬇ エクスポート</button>
      <button id="settingsBtn" class="btn" title="Magic Hour APIキーなどの設定はこちらから">⚙ 設定</button>
    </div>
  </header>

  <!-- 画面サイズで「カスタム」を選んだ時だけ表示する。範囲(min/max)はscript.jsで設定する -->
  <div id="canvasCustomBar" class="subbar hidden">
    <span class="subbar-label">画面サイズ（カスタム）</span>
    <span class="canvas-custom">
      <input id="canvasCustomWidth" type="number" class="select canvas-custom-input" step="2" title="幅(px)">
      ×
      <input id="canvasCustomHeight" type="number" class="select canvas-custom-input" step="2" title="高さ(px)">
      px
    </span>
    <span class="subbar-note">幅・高さを入力して Enter で反映</span>
  </div>

  <div id="status" class="status"></div>

  <section class="preview-panel">
    <h2 class="preview-title">プレビュー</h2>
    <div class="preview-canvas-wrap" id="previewWrap">
      <canvas id="previewCanvas" width="1280" height="720"></canvas>
    </div>
    <!-- 再生操作(プレビューとタイムラインの間) -->
    <div class="transport-bar" id="transportBar">
      <div class="transport-buttons">
        <button id="rewindBtn" class="btn" title="最初へ戻る" aria-label="最初へ戻る">⏮</button>
        <button id="backBtn" class="btn" title="5秒戻る" aria-label="5秒戻る">⏪</button>
        <!-- 再生と停止を兼ねる。表示(▶/⏸)はscript.jsのupdatePlayButtonで切り替える -->
        <button id="playBtn" class="btn primary" title="再生" aria-label="再生">▶</button>
        <button id="forwardBtn" class="btn" title="5秒進む" aria-label="5秒進む">⏩</button>
        <button id="endBtn" class="btn" title="最後のクリップの終わりへ" aria-label="最後のクリップの終わりへ">⏭</button>
      </div>
      <div class="time-counter" id="timeCounter">
        <span id="currentTimeLabel" class="current">0:00</span> / <span id="totalTimeLabel">0:00</span>
      </div>
    </div>
  </section>

  <main class="editor">
    <div class="ruler-wrap">
      <div class="track-labels-spacer"></div>
      <div id="ruler" class="ruler"></div>
    </div>
    <div id="tracksContainer" class="tracks-container"></div>
  </main>

  <audio id="hiddenAudio" hidden></audio>

  <!-- 画像/テキストクリップ、および空いている部分を右クリックした時に出るメニュー -->
  <div id="clipContextMenu" class="context-menu hidden">
    <button id="ctxGenVideoBtn" class="context-menu-item">🎬 この画像から動画を生成</button>
    <button id="ctxGenImageBtn" class="context-menu-item">✨ この画像を基に新規生成</button>
    <button id="ctxGenNewImageBtn" class="context-menu-item">✨ 新しい画像を生成</button>
    <button id="ctxAddTextBtn" class="context-menu-item">📝 テキストを追加</button>
    <button id="ctxEditTextBtn" class="context-menu-item">✏️ テキストを編集</button>
    <button id="ctxCutBtn" class="context-menu-item">✂ ここでカット</button>
    <button id="ctxDeleteBtn" class="context-menu-item">🗑 クリップを削除（Backspace）</button>
  </div>

  <!-- 上記メニューから開く、プロンプト入力パネル(動画生成/画像編集で共用) -->
  <div id="aiActionPanel" class="ai-panel hidden">
    <div class="ai-panel-header">
      <span id="aiPanelTitle"></span>
      <button id="aiPanelCloseBtn" class="ai-panel-close" title="閉じる">×</button>
    </div>
    <p id="aiPanelHint" class="ai-panel-hint"></p>
    <textarea id="aiPanelPrompt" class="ai-panel-textarea" rows="3"
      placeholder="プロンプトを入力(例:家で寝転がる黒猫)"></textarea>
    <!-- モデル・解像度の選択肢はscript.jsのAI_MODELSから作る -->
    <div id="aiPanelModelRow" class="ai-panel-row stacked">
      <label class="settings-label" for="aiPanelModel">モデル</label>
      <select id="aiPanelModel" class="select"></select>
      <p id="aiPanelModelNote" class="ai-panel-model-note"></p>
    </div>
    <div id="aiPanelResolutionRow" class="ai-panel-row hidden">
      <label class="settings-label" for="aiPanelResolution">解像度</label>
      <select id="aiPanelResolution" class="select"></select>
    </div>
    <div id="aiPanelAspectRow" class="ai-panel-row hidden">
      <label class="settings-label" for="aiPanelAspectRatio">縦横比</label>
      <select id="aiPanelAspectRatio" class="select"></select>
    </div>
    <div class="ai-panel-footer">
      <button id="aiPanelSubmitBtn" class="btn primary">生成する</button>
    </div>
    <p id="aiPanelStatus" class="ai-panel-status"></p>
  </div>

  <!-- テキストクリップの追加/編集パネル -->
  <div id="textEditPanel" class="ai-panel hidden">
    <div class="ai-panel-header">
      <span id="textPanelTitle">📝 テキストを追加</span>
      <button id="textPanelCloseBtn" class="ai-panel-close" title="閉じる">×</button>
    </div>
    <textarea id="textPanelContent" class="ai-panel-textarea" rows="2"
      placeholder="表示するテキストを入力(改行できます)"></textarea>
    <div class="ai-panel-row">
      <label class="settings-label" for="textPanelFont">フォント</label>
      <select id="textPanelFont" class="select">
        <option value="noto-sans-jp">Noto Sans JP(標準)</option>
        <option value="noto-serif-jp">Noto Serif JP(明朝体)</option>
        <option value="dela-gothic-one">Dela Gothic One(極太)</option>
        <option value="zen-maru-gothic">Zen Maru Gothic(丸ゴシック)</option>
      </select>
    </div>
    <div class="ai-panel-row">
      <label class="settings-label" for="textPanelColor">文字色</label>
      <input type="color" id="textPanelColor" class="text-panel-color" value="#ffffff">
    </div>
    <div class="ai-panel-row">
      <label class="settings-label" for="textPanelBold">太さ</label>
      <select id="textPanelBold" class="select">
        <option value="0">標準</option>
        <option value="1">やや太い</option>
        <option value="2">太い</option>
        <option value="3">極太</option>
      </select>
    </div>
    <div class="ai-panel-row">
      <label class="settings-label text-panel-check" for="textPanelOutline">
        <input type="checkbox" id="textPanelOutline" checked> 枠線
      </label>
      <input type="color" id="textPanelOutlineColor" class="text-panel-color" value="#000000" title="枠線の色">
    </div>
    <div class="ai-panel-row">
      <label class="settings-label" for="textPanelOutlineWidth">枠線の太さ</label>
      <span class="text-panel-range">
        <input type="range" id="textPanelOutlineWidth" min="1" max="20" step="1" value="6">
        <span id="textPanelOutlineWidthValue" class="text-panel-range-value">6</span>
      </span>
    </div>
    <!-- 見本は実際のプレビュー・書き出しと同じ描き方(drawStyledTextLines)で描く -->
    <canvas id="textPanelPreview" class="text-panel-font-preview" width="640" height="160"></canvas>
    <p class="ai-panel-hint">配置は追加後、上のプレビュー画面でテキストを直接ドラッグして調整できます。</p>
    <div class="ai-panel-footer">
      <button id="textPanelSubmitBtn" class="btn primary">追加する</button>
    </div>
    <p id="textPanelStatus" class="ai-panel-status"></p>
  </div>

  <!-- 設定パネル(Magic Hour APIキー) -->
  <div id="settingsBackdrop" class="modal-backdrop hidden"></div>
  <div id="settingsPanel" class="ai-panel settings-panel hidden">
    <div class="ai-panel-header">
      <span>⚙ 設定</span>
      <button id="settingsCloseBtn" class="ai-panel-close" title="閉じる">×</button>
    </div>
    <p id="settingsKeyStatus" class="ai-panel-hint"></p>
    <label class="settings-label" for="settingsApiKeyInput">Magic Hour APIキー</label>
    <input type="password" id="settingsApiKeyInput" class="ai-panel-textarea" autocomplete="off"
      placeholder="mhk_live_...">
    <p class="settings-note">
      <a href="https://magichour.ai/developer?tab=api-keys" target="_blank" rel="noopener">APIキーの取得はこちら ↗</a>
    </p>
    <div class="ai-panel-footer settings-footer">
      <button id="settingsClearBtn" class="btn">キーを削除</button>
      <button id="settingsSaveBtn" class="btn primary">保存</button>
    </div>
    <p id="settingsStatus" class="ai-panel-status"></p>
    <div class="settings-danger">
      <span class="settings-label">危険な操作</span>
      <button id="clearUploadsBtn" class="btn-warning" title="サーバーに保存されているファイルを全て削除します。注：編集中のデータが消えます">🧹 編集状態をリセット</button>
      <p class="settings-note">サーバーに保存された素材をすべて削除し、タイムラインを空にします。</p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
